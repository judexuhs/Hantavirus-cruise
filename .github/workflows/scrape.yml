name: Refresh sources

on:
  schedule:
    # Every 6 hours, at 5 minutes past the hour to avoid the top-of-hour CI rush.
    - cron: "5 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/scrape/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Scrape (dry on PRs, live on cron/dispatch)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm scrape:dry
          else
            pnpm scrape
          fi

      - name: Validate build output
        run: pnpm build

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain src/content/news src/data/news-meta.json)" ]; then
            echo "No source changes — exiting clean."
            exit 0
          fi
          git config user.name  "hantavirus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/news src/data/news-meta.json
          STAMP=$(date -u +"%Y-%m-%d %H:%MZ")
          git commit -m "chore(scrape): refresh sources ${STAMP}"
          git push
