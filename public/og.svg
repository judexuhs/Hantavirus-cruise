      <stop offset="0%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#f5e0de"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80, 90)">
    <circle cx="22" cy="22" r="22" fill="#b8332b"/>
    <text x="60" y="32" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="600" fill="#1a1a1a">HANTAVIRUS CRUISE TRACKER</text>
